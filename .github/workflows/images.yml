name: Image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/osthelia/osthelia-widgets

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm test
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: local/osthelia-widgets:scan
          cache-from: type=gha
          cache-to: type=gha,mode=max
          no-cache-filters: runtime
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: local/osthelia-widgets:scan
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha

  # Inline steps instead of the reusable workflow: this repository is public and cannot call a workflow
  # from the private Osthelia/GitOps repository. Staging first; production is promoted by hand in GitOps.
  gitops:
    name: Bump osthelia-widgets
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    concurrency:
      group: gitops-bump
      cancel-in-progress: false
    steps:
      - name: Checkout GitOps repository
        uses: actions/checkout@v4
        with:
          repository: Osthelia/GitOps
          ref: main
          ssh-key: ${{ secrets.GITOPS_DEPLOY_KEY }}

      - name: Set tag
        env:
          NAME: osthelia-widgets
          TAG: ${{ github.sha }}
          FILE: apps/staging/kustomization.yaml
        run: |
          set -euo pipefail
          grep -qE "name: ghcr\.io/osthelia/${NAME}," "$FILE" \
            || { echo "::error::${NAME} not found in ${FILE}"; exit 1; }
          sed -i -E "s#(name: ghcr\.io/osthelia/${NAME},[[:space:]]*newTag:)[^}]*#\1 \"${TAG}\" #" "$FILE"
          grep -E "name: ghcr\.io/osthelia/${NAME}," "$FILE"

      - name: Commit and push
        env:
          TAG: ${{ github.sha }}
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "Already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore(staging): osthelia-widgets -> ${TAG:0:7}"
          for attempt in 1 2 3; do
            git push origin HEAD:main && exit 0
            git pull --rebase origin main
          done
          echo "::error::push failed after 3 attempts"
          exit 1
